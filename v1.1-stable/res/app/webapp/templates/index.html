<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>讲义工作台 · Flash</title>
  <link rel="icon" href="{{ url_for('static', filename='vendor/app-icon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='workspace.css') }}">
  <script defer src="{{ url_for('static', filename='vendor/lucide.min.js') }}"></script>
  <script defer src="{{ url_for('static', filename='workspace.js') }}"></script>
</head>
<body>
  <a href="#mainContent" class="skip-link">跳到工作区</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="工作台导航">
      <a href="#workspace" class="brand">
        <span class="brand-icon"><i data-lucide="notebook-pen"></i></span>
        <span>讲义工作台<small>FLASH</small></span>
      </a>
      <button class="new-button" id="newTask"><i data-lucide="plus"></i>新建讲义</button>
      <nav class="main-nav">
        <button class="nav-item active" data-view="workspace" aria-label="工作区" data-tooltip="工作区" aria-current="page"><i data-lucide="panels-top-left"></i><span>工作区</span></button>
        <button class="nav-item" data-view="history" aria-label="生成记录" data-tooltip="生成记录"><i data-lucide="clock-3"></i><span>生成记录</span><span class="count" id="historyCount">0</span></button>
        <button class="nav-item" data-view="templates" aria-label="讲义模板" data-tooltip="讲义模板"><i data-lucide="panels-left-bottom"></i><span>讲义模板</span></button>
      </nav>
      <div class="recent-heading">最近任务</div>
      <div id="recentTasks" class="recent-tasks"><p class="sidebar-empty">暂无任务</p></div>
      <div class="sidebar-bottom">
        <div class="local-status"><span class="status-dot"></span><span id="connectionLabel">本地服务</span><span class="version">1.1</span></div>
        <button class="nav-item" id="settingsButton" aria-label="偏好设置" data-tooltip="偏好设置"><i data-lucide="settings-2"></i><span>偏好设置</span></button>
      </div>
    </aside>

    <div class="main-shell">
      <header class="topbar">
        <div class="breadcrumb"><span>我的讲义</span><i data-lucide="chevron-right"></i><strong id="viewTitle">工作区</strong></div>
        <div class="top-actions">
          <span class="offline-badge"><i data-lucide="shield-check"></i>离线模式</span>
          <button class="icon-button" id="themeButton" aria-label="切换深色外观" data-tooltip="切换外观"><i data-lucide="moon"></i></button>
        </div>
      </header>

      <main id="mainContent">
        <section id="workspaceView" class="view">
          <div class="page-heading">
            <div><p class="eyebrow" id="todayLabel"></p><h1>准备一份好讲义</h1></div>
            <span class="saved-state" id="saveState"><i data-lucide="check"></i>配置已保存</span>
          </div>
          <div class="workspace-grid">
            <div class="materials-column">
              <section class="materials-section" aria-labelledby="materialsTitle">
                <div class="section-heading">
                  <h2 id="materialsTitle">讲义素材 <span class="count" id="fileCount">0</span></h2>
                  <div class="toolbar">
                    <button class="icon-button" id="undoFiles" aria-label="撤销文件操作" data-tooltip="撤销" disabled><i data-lucide="undo-2"></i></button>
                    <button class="icon-button danger-hover" id="clearFiles" aria-label="清空素材" data-tooltip="清空素材" disabled><i data-lucide="trash-2"></i></button>
                  </div>
                </div>
                <button class="drop-zone" id="drop" type="button" aria-label="添加讲义素材">
                  <span class="upload-symbol"><i data-lucide="file-up"></i><span class="upload-plus"><i data-lucide="plus"></i></span></span>
                  <span class="drop-title">添加讲义素材</span>
                  <span class="drop-meta">DOCX / ZIP · 总计不超过 500 MB</span>
                </button>
                <input type="file" id="fileInput" accept=".zip,.docx" multiple hidden>
                <div class="file-tools" id="fileTools" hidden>
                  <label class="search-field"><i data-lucide="search"></i><input type="search" id="fileSearch" placeholder="搜索素材" aria-label="搜索素材"></label>
                  <span id="totalSize">0 KB</span>
                </div>
                <div id="fileList" class="file-list" aria-label="素材列表"></div>
                <div id="uploadErrors" class="notice error" role="alert" hidden></div>
                <div class="pairing-row"><label for="docxMode">Word 文件分组</label><select id="docxMode" class="quiet-select"><option value="auto">两个文件成对</option><option value="separate">各自生成</option></select></div>
                <div id="pairingNote" class="pairing-note" aria-live="polite">尚未添加素材</div>
              </section>

              <section class="generation-section" aria-labelledby="generationTitle">
                <div class="section-heading"><h2 id="generationTitle">生成任务</h2><span class="muted small" id="elapsedLabel"></span></div>
                <div id="idleState" class="idle-state"><span class="idle-icon"><i data-lucide="layers"></i></span><div><strong>等待开始</strong><p>教师版与学生版</p></div><i data-lucide="arrow-up-right" class="idle-arrow"></i></div>
                <div id="progressWrap" hidden>
                  <div class="progress-heading"><strong id="progressTitle" aria-live="polite">准备中</strong><span id="progressPercent">0%</span></div>
                  <p class="progress-stage" id="progressStage"></p>
                  <div class="progress-track" id="progressTrack" role="progressbar" aria-label="生成进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="barfill"></div></div>
                  <div class="result-table-wrap"><table><thead><tr><th>专题</th><th>教师版</th><th>学生版</th></tr></thead><tbody id="resultRows"></tbody></table></div>
                  <div id="warnings" class="notice" hidden></div>
                  <div class="result-actions">
                    <a class="primary-button" id="downloadResult" hidden><i data-lucide="download"></i>下载成品</a>
                    <button class="secondary-button" id="openResult" hidden><i data-lucide="folder-open"></i>成品位置</button>
                    <button class="secondary-button" id="reconnect" hidden><i data-lucide="refresh-cw"></i>重新连接</button>
                  </div>
                </div>
              </section>
            </div>

            <aside class="inspector" aria-label="讲义配置">
              <form id="configForm">
                <div class="section-heading"><h2>讲义配置</h2><button type="button" class="icon-button" id="resetConfig" aria-label="恢复默认配置" data-tooltip="恢复默认配置"><i data-lucide="rotate-ccw"></i></button></div>
                <fieldset id="configFields"><legend class="sr-only">生成选项</legend>
                  <label class="field-label" id="subjectLabel">学科</label>
                  <div class="subject-grid" id="subjectGrid" role="group" aria-labelledby="subjectLabel"></div>
                  <div class="field-grid"><label class="field">学段<select id="eduLevel"><option>小学</option><option>初中</option><option selected>高中</option></select></label><label class="field">年级<select id="gradeSelect"></select></label></div>
                  <div class="field-grid"><label class="field">课程类型<select id="handoutType"></select></label><label class="field">学年<select id="academicYear"></select></label></div>
                  <label class="field-label" id="templateLabel">讲义模板</label>
                  <div class="segmented" role="group" aria-labelledby="templateLabel" id="templateControl"><button type="button" data-template="1v1" aria-pressed="true"><i data-lucide="user-round"></i>1 对 1</button><button type="button" data-template="class" aria-pressed="false"><i data-lucide="users-round"></i>班课</button></div>
                  <button type="button" id="previewButton" class="template-preview"><img id="templateThumb" src="{{ url_for('static', filename='previews/1v1.png') }}" alt="1 对 1 讲义模板首页"><span><strong id="templateName">1 对 1 讲义</strong><small>点击查看真实模板首页</small></span><i data-lucide="scan-eye"></i></button>
                  <label class="field">分块策略<select id="splitMode"><option value="smart">智能分块（推荐）</option><option value="full">完整保留</option></select></label>
                  <section class="split-explainer" id="splitExplainer" aria-live="polite">
                    <div class="split-heading"><strong id="splitTitle">智能分块</strong><span id="splitBadge">推荐</span></div>
                    <p id="splitDescription"></p>
                    <div class="split-steps" id="splitSteps"></div>
                    <p class="split-note" id="splitNote"></p>
                  </section>
                </fieldset>
                <div class="output-name"><span class="field-label">输出文件名</span><p id="filenamePreview"></p></div>
                <button class="primary-button generate-button" id="startButton" type="submit" disabled><i data-lucide="sparkles"></i><span>生成讲义</span><i data-lucide="arrow-right"></i></button>
                <div class="output-caption"><i data-lucide="files"></i>教师版 + 学生版 <span>DOCX</span></div>
              </form>
            </aside>
          </div>
        </section>

        <section id="historyView" class="view" hidden>
          <div class="page-heading"><div><p class="eyebrow">我的讲义</p><h1>生成记录</h1></div><button class="icon-button" id="refreshHistory" aria-label="刷新生成记录" data-tooltip="刷新记录"><i data-lucide="refresh-cw"></i></button></div>
          <div class="history-toolbar"><label class="search-field"><i data-lucide="search"></i><input id="historySearch" type="search" placeholder="搜索文件名或学科" aria-label="搜索生成记录"></label><select id="historyFilter" aria-label="任务状态"><option value="all">全部状态</option><option value="running">生成中</option><option value="done">已完成</option><option value="error">未完成</option></select></div>
          <div id="historyList"></div>
        </section>

        <section id="templatesView" class="view" hidden>
          <div class="page-heading"><div><p class="eyebrow">我的讲义</p><h1>讲义模板</h1></div><span class="muted">2 个本地模板</span></div>
          <div class="template-library">
            <article class="template-item"><button class="library-preview" data-preview="1v1" aria-label="预览 1 对 1 模板"><img src="{{ url_for('static', filename='previews/1v1.png') }}" alt="1 对 1 讲义模板首页"></button><div class="template-item-info"><div><h2>1 对 1 讲义</h2><p>个性化辅导</p></div><button class="secondary-button" data-use-template="1v1">使用模板<i data-lucide="arrow-right"></i></button></div></article>
            <article class="template-item"><button class="library-preview" data-preview="class" aria-label="预览班课模板"><img src="{{ url_for('static', filename='previews/class.png') }}" alt="班课讲义模板首页"></button><div class="template-item-info"><div><h2>班课讲义</h2><p>班级授课</p></div><button class="secondary-button" data-use-template="class">使用模板<i data-lucide="arrow-right"></i></button></div></article>
          </div>
        </section>
      </main>
      <footer class="app-footer"><span><i data-lucide="hard-drive"></i>本地工作空间</span><span id="footerStatus">就绪</span></footer>
    </div>
  </div>

  <dialog id="settingsDialog" class="settings-dialog"><form method="dialog"><div class="dialog-heading"><h2>偏好设置</h2><button class="icon-button" aria-label="关闭偏好设置"><i data-lucide="x"></i></button></div><div class="settings-row"><label for="themeSelect">外观</label><select id="themeSelect"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></div><div class="settings-row"><label for="compactFiles">紧凑文件列表</label><input id="compactFiles" type="checkbox" role="switch" class="switch"></div><div class="settings-row"><span>运行模式</span><span class="green">本地离线</span></div><div class="settings-row"><span>应用版本</span><span class="muted">Flash 1.1</span></div></form></dialog>
  <dialog id="previewDialog" class="preview-dialog"><div class="dialog-heading"><h2 id="previewTitle">讲义模板</h2><div class="toolbar"><a id="templatePdf" class="icon-button" aria-label="打开完整模板 PDF" data-tooltip="完整模板" target="_blank" rel="noopener"><i data-lucide="external-link"></i></a><button id="closePreview" class="icon-button" aria-label="关闭模板预览"><i data-lucide="x"></i></button></div></div><div class="preview-paper"><img id="previewImage" alt="模板首页"></div><div class="preview-footer"><span class="muted small">模板首页</span><button id="usePreviewTemplate" class="primary-button">使用此模板<i data-lucide="arrow-right"></i></button></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
